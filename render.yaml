services:
  - type: web
    name: telegram-cpanel-stream-mvp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: STREAM_SECRET
        generateValue: true
      - key: CPANEL_WATCH_URL
        sync: false
      - key: PUBLIC_BOT_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: TOKEN_TTL_SECONDS
        value: "2592000"
      - key: TELEGRAM_REQUEST_SIZE
        value: "524288"
